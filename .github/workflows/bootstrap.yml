name: Bootstrap source and build APK

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/archive.b64"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and validate project archive
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/archive.b64 > /tmp/pocket-agent-source.zip
          unzip -t /tmp/pocket-agent-source.zip
          mkdir -p /tmp/pocket-agent-source
          unzip -q /tmp/pocket-agent-source.zip -d /tmp/pocket-agent-source
          test -f /tmp/pocket-agent-source/settings.gradle.kts
          test -f /tmp/pocket-agent-source/app/build.gradle.kts
          test -f /tmp/pocket-agent-source/.github/workflows/android.yml
          cp -a /tmp/pocket-agent-source/. .
          rm -f .github/workflows/build-from-archive.yml
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The GitHub Actions token cannot add or remove workflow files.
          # Commit application source now; add the Android workflow separately
          # with the repository connector after this run.
          git add -A -- . ':!.github/workflows/android.yml' ':!.github/workflows/build-from-archive.yml'
          if ! git diff --cached --quiet; then
            git commit -m "Add Pocket Agent Android source"
            git push origin HEAD:main
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK already on the runner
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses and install packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
