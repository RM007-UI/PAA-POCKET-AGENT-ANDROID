name: Build embedded Termux runtime for PAA

on:
  push:
    branches: ["main", "codex-hybrid"]
    paths:
      - ".github/workflows/embedded-termux-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paa-embedded-termux-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    env:
      TERMUX_BUILDER_IMAGE_NAME: ghcr.io/termux/package-builder:latest
    steps:
      - name: Check out upstream Termux package build system
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          ref: f99592d21e8c0d03d4cd8ad152b9c651894019c0
          path: termux-packages
          fetch-depth: 1

      - name: Set PAA prefix and disable optional libunbound Python binding
        working-directory: termux-packages
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^TERMUX_APP__PACKAGE_NAME="com.termux"$/TERMUX_APP__PACKAGE_NAME="com.rm007.pocketagent"/' scripts/properties.sh
          grep -Fxq 'TERMUX_APP__PACKAGE_NAME="com.rm007.pocketagent"' scripts/properties.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/libunbound/build.sh")
          source = path.read_text()
          required = [
              'TERMUX_PKG_BUILD_DEPENDS="python, swig"',
              'TERMUX_PKG_PYTHON_COMMON_BUILD_DEPS="wheel"',
              'TERMUX_PKG_PYTHON_CROSS_BUILD_DEPS="swig"',
              '--with-pyunbound',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit(f"Unexpected libunbound recipe; missing: {missing}")
          source = source.replace('TERMUX_PKG_BUILD_DEPENDS="python, swig"', 'TERMUX_PKG_BUILD_DEPENDS=""')
          source = source.replace('TERMUX_PKG_PYTHON_COMMON_BUILD_DEPS="wheel"', 'TERMUX_PKG_PYTHON_COMMON_BUILD_DEPS=""')
          source = source.replace('TERMUX_PKG_PYTHON_CROSS_BUILD_DEPS="swig"', 'TERMUX_PKG_PYTHON_CROSS_BUILD_DEPS=""')
          source = source.replace('--with-pyunbound', '--without-pyunbound')
          if '--with-pyunbound' in source or 'swig"' in source:
              raise SystemExit("Optional libunbound wrapper dependencies were not fully disabled")
          path.write_text(source)
          PY

          # kernel.org intermittently times out for GNU source archives in CI.
          # Redirect all GNU package recipes using that mirror to the official GNU host;
          # package versions and upstream checksum verification remain unchanged.
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for path in Path("packages").glob("*/build.sh"):
              source = path.read_text()
              updated = source.replace("https://mirrors.kernel.org/gnu/", "https://ftp.gnu.org/gnu/")
              if updated != source:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit("No GNU mirror URLs were found to patch")
          print("Redirected GNU source URLs in:", ", ".join(changed))
          PY

          # Apache removes older APR-util releases from its live mirror.
          # Keep the pinned 1.6.5 source and its upstream checksum, but fetch it
          # from the Apache distribution archive where that release is retained.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("packages/apr-util/build.sh")
          source = path.read_text()
          old = "https://downloads.apache.org/apr/apr-util-"
          new = "https://archive.apache.org/dist/apr/apr-util-"
          if old not in source:
              raise SystemExit("Expected APR-util Apache download URL was not found")
          path.write_text(source.replace(old, new))
          PY

          # This upstream bootstrap still lists bzip2 although this pinned source revision
          # no longer has a bzip2 package recipe. It is not required for the embedded shell.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/build-bootstraps.sh")
          source = path.read_text()
          line = next((line for line in source.splitlines() if 'PACKAGES+=("bzip2")' in line), None)
          if line is None:
              raise SystemExit("Expected obsolete bzip2 bootstrap entry was not found")
          source = source.replace(line + "\n", "", 1)
          if 'PACKAGES+=("bzip2")' in source:
              raise SystemExit("bzip2 bootstrap entry is still present")
          path.write_text(source)
          PY

      - name: Pull upstream Termux package-builder image
        run: docker pull "$TERMUX_BUILDER_IMAGE_NAME"

      - name: Verify Android NDK and host Python
        working-directory: termux-packages
        run: |
          set -euo pipefail
          ./scripts/run-docker.sh bash -c 'test -x /home/builder/lib/android-ndk-r30/toolchains/llvm/prebuilt/linux-x86_64/bin/clang && /usr/bin/python3.14 --version'

      - name: Clear previous package outputs
        working-directory: termux-packages
        run: ./scripts/run-docker.sh ./clean.sh

      - name: Prepare bootstrap output outside the bind mount
        working-directory: termux-packages
        run: |
          set -euo pipefail
          rm -f bootstrap-aarch64.zip bootstrap-aarch64.zip.sha256 bootstrap-x86_64.zip bootstrap-x86_64.zip.sha256
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/build-bootstraps.sh")
          source = path.read_text()
          old = 'mv -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" "$TERMUX_PACKAGES_DIRECTORY/"'
          new = 'mkdir -p /tmp/paa-bootstrap-output\n\tcp -f "${BOOTSTRAP_TMPDIR}/bootstrap-${1}.zip" /tmp/paa-bootstrap-output/'
          if source.count(old) != 1:
              raise SystemExit("Expected single bootstrap output move was not found")
          path.write_text(source.replace(old, new, 1))
          PY
          CONTAINER_NAME=termux-package-builder ./scripts/run-docker.sh mkdir -p /tmp/paa-bootstrap-output

      - name: Build ${{ matrix.arch }} Termux bootstrap with developer tools
        working-directory: termux-packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          CONTAINER_NAME=termux-package-builder ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures "$ARCH" --add git,python,wget,tree
          docker cp "termux-package-builder:/tmp/paa-bootstrap-output/bootstrap-$ARCH.zip" "bootstrap-$ARCH.zip"
          test -s "bootstrap-$ARCH.zip"

      - name: Verify bootstrap and calculate checksum
        working-directory: termux-packages
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test -s "bootstrap-$ARCH.zip"
          unzip -l "bootstrap-$ARCH.zip" | grep -q 'SYMLINKS.txt'
          sha256sum "bootstrap-$ARCH.zip" > "bootstrap-$ARCH.zip.sha256"
          cat "bootstrap-$ARCH.zip.sha256"

      - name: Upload verified ${{ matrix.arch }} bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: paa-embedded-termux-bootstrap-${{ matrix.arch }}
          path: |
            termux-packages/bootstrap-${{ matrix.arch }}.zip
            termux-packages/bootstrap-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 30

  merge-bootstrap-artifacts:
    needs: bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Download both architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: paa-embedded-termux-bootstrap-*
          path: bootstrap-artifacts
          merge-multiple: true

      - name: Verify merged bootstrap files
        run: |
          set -euo pipefail
          for ARCH in aarch64 x86_64; do
            test -s "bootstrap-artifacts/bootstrap-$ARCH.zip"
            test -s "bootstrap-artifacts/bootstrap-$ARCH.zip.sha256"
            (cd bootstrap-artifacts && sha256sum -c "bootstrap-$ARCH.zip.sha256")
            unzip -l "bootstrap-artifacts/bootstrap-$ARCH.zip" | grep -q 'SYMLINKS.txt'
          done

      - name: Publish combined multiarch bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: paa-embedded-termux-bootstrap-multiarch
          path: |
            bootstrap-artifacts/bootstrap-aarch64.zip
            bootstrap-artifacts/bootstrap-aarch64.zip.sha256
            bootstrap-artifacts/bootstrap-x86_64.zip
            bootstrap-artifacts/bootstrap-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 30
