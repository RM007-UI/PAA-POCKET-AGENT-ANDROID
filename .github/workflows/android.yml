name: Build Pocket Agent APK

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build embedded Termux runtime for PAA"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Download and verify embedded Termux bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paa-bootstrap" app/src/main/assets
          gh release download paa-embedded-termux-bootstrap-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "bootstrap-aarch64.zip" \
            --pattern "bootstrap-aarch64.zip.sha256" \
            --dir "$RUNNER_TEMP/paa-bootstrap"
          (cd "$RUNNER_TEMP/paa-bootstrap" && sha256sum -c bootstrap-aarch64.zip.sha256)
          install -m 0644 "$RUNNER_TEMP/paa-bootstrap/bootstrap-aarch64.zip" app/src/main/assets/bootstrap-aarch64.zip
          install -m 0644 "$RUNNER_TEMP/paa-bootstrap/bootstrap-aarch64.zip.sha256" app/src/main/assets/bootstrap-aarch64.zip.sha256

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
