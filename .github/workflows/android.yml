name: Build Pocket Agent APK

on:
  push:
    branches: ["main", "codex-hybrid"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/**"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build embedded Termux runtime for PAA"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Resolve a successful bootstrap build
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BOOTSTRAP_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="$BOOTSTRAP_RUN_ID"
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/embedded-termux-bootstrap.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No successful embedded runtime exists yet; APK build continues as compile validation only."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download and verify the embedded Termux bootstrap
        if: steps.bootstrap.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOOTSTRAP_RUN_ID: ${{ steps.bootstrap.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paa-bootstrap" app/src/main/assets
          gh run download "$BOOTSTRAP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "paa-embedded-termux-bootstrap-multiarch" \
            --dir "$RUNNER_TEMP/paa-bootstrap"
          (cd "$RUNNER_TEMP/paa-bootstrap" && sha256sum -c bootstrap-aarch64.zip.sha256)
          for ARCH in aarch64 x86_64; do
            install -m 0644 "$RUNNER_TEMP/paa-bootstrap/bootstrap-$ARCH.zip" "app/src/main/assets/bootstrap-$ARCH.zip"
            install -m 0644 "$RUNNER_TEMP/paa-bootstrap/bootstrap-$ARCH.zip.sha256" "app/src/main/assets/bootstrap-$ARCH.zip.sha256"
          done

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile source while embedded runtime is being built
        if: steps.bootstrap.outputs.available != 'true'
        run: gradle --no-daemon compileDebugKotlin --stacktrace

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify embedded runtime is packaged
        if: steps.bootstrap.outputs.available == 'true'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          for ARCH in aarch64 x86_64; do
            unzip -Z1 "$APK" | grep -Fxq "assets/bootstrap-$ARCH.zip"
            unzip -Z1 "$APK" | grep -Fxq "assets/bootstrap-$ARCH.zip.sha256"
            unzip -p "$APK" "assets/bootstrap-$ARCH.zip.sha256" | grep -Eq "^[a-fA-F0-9]{64}[[:space:]]+bootstrap-$ARCH[.]zip$"
          done

      - name: Upload APK artifact
        if: steps.bootstrap.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android emulator smoke tests
        if: steps.bootstrap.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p emulator-test-results
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am force-stop com.rm007.pocketagent
            adb shell monkey -p com.rm007.pocketagent 1
            sleep 10
            adb shell uiautomator dump /sdcard/initial.xml
            adb pull /sdcard/initial.xml emulator-test-results/initial.xml
            python3 -c 'import xml.etree.ElementTree as E,subprocess; r=E.parse("emulator-test-results/initial.xml").getroot(); n=next((n for n in r.iter("node") if "ترمینال داخلی PAA" in n.attrib.get("content-desc","")),None); assert n is not None,"Terminal button not found in UI"; b=n.attrib["bounds"].replace("][",",").replace("[","").replace("]","").split(","); subprocess.run(["adb","shell","input","tap",str((int(b[0])+int(b[2]))//2),str((int(b[1])+int(b[3]))//2)],check=True)'
            adb shell 'for i in $(seq 1 300); do run-as com.rm007.pocketagent test -x files/usr/bin/bash && exit 0; sleep 1; done; exit 1'
            adb shell 'run-as com.rm007.pocketagent sh -c "P=/data/data/com.rm007.pocketagent/files/usr; export PREFIX=$P TERMUX_PREFIX=$P HOME=/data/data/com.rm007.pocketagent/files/home TMPDIR=$P/tmp PATH=$P/bin:/system/bin:/system/xbin LD_LIBRARY_PATH=$P/lib LD_PRELOAD=$P/lib/libtermux-exec-linker-ld-preload.so TERMUX_EXEC__SYSTEM_LINKER_EXEC__MODE=force TERMUX_PACKAGE_MANAGER=apt TERMUX_PACKAGE_ARCH=x86_64 ANDROID_ROOT=/system ANDROID_DATA=/data ANDROID__BUILD_VERSION_SDK=35; /system/bin/linker64 $P/bin/bash --login -c \"printf PAA_X86_64_RUNTIME_OK; uname -m; id; dpkg --version; pkg --version\""' > emulator-test-results/runtime-smoke.txt
            grep -q PAA_X86_64_RUNTIME_OK emulator-test-results/runtime-smoke.txt
            grep -q x86_64 emulator-test-results/runtime-smoke.txt
            adb shell uiautomator dump /sdcard/window.xml
            adb pull /sdcard/window.xml emulator-test-results/window.xml
            test -s emulator-test-results/window.xml
            adb exec-out screencap -p > emulator-test-results/screen.png
            adb logcat -d -t 12000 > emulator-test-results/logcat.txt
            ! grep -E "FATAL EXCEPTION|Process: com.rm007.pocketagent" emulator-test-results/logcat.txt
      - name: Upload emulator test results
        if: always() && steps.bootstrap.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-emulator-test-results
          path: emulator-test-results/
          if-no-files-found: ignore
          retention-days: 14
