name: Build Pocket Agent APK

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
      - ".github/workflows/android.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Build embedded Termux runtime for PAA"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Resolve a successful bootstrap build
        id: bootstrap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          BOOTSTRAP_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="$BOOTSTRAP_RUN_ID"
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/embedded-termux-bootstrap.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id // empty')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No successful embedded runtime exists yet; APK build steps are skipped safely."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download and verify the embedded Termux bootstrap
        if: steps.bootstrap.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOOTSTRAP_RUN_ID: ${{ steps.bootstrap.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/paa-bootstrap" app/src/main/assets
          gh run download "$BOOTSTRAP_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "paa-embedded-termux-bootstrap-aarch64" \
            --dir "$RUNNER_TEMP/paa-bootstrap"
          (cd "$RUNNER_TEMP/paa-bootstrap" && sha256sum -c bootstrap-aarch64.zip.sha256)
          install -m 0644 "$RUNNER_TEMP/paa-bootstrap/bootstrap-aarch64.zip" app/src/main/assets/bootstrap-aarch64.zip
          install -m 0644 "$RUNNER_TEMP/paa-bootstrap/bootstrap-aarch64.zip.sha256" app/src/main/assets/bootstrap-aarch64.zip.sha256

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile source while embedded runtime is being built
        if: steps.bootstrap.outputs.available != 'true'
        run: gradle --no-daemon compileDebugKotlin --stacktrace

      - name: Assemble debug APK (compile validation when runtime artifact is unavailable)
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK artifact
        if: steps.bootstrap.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pocket-agent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
